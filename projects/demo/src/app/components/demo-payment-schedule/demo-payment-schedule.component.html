<div class="demo-payment-schedule">
  <h3 class="demo-payment-schedule__month cba-text-heading-md">{{ monthYear }}</h3>

  <div
    class="demo-calendar"
    role="img"
    [attr.aria-label]="monthYear + ' calendar, day ' + selectedDay + ' selected'">
    @for (day of days; track day) {
      <div
        class="demo-calendar__day"
        [class.demo-calendar__day--selected]="day === selectedDay"
        [attr.aria-current]="day === selectedDay ? 'date' : null">
        {{ day }}
      </div>
    }
  </div>

  <h3 class="demo-payment-schedule__heading cba-text-heading-md">Payments on {{ selectedDate }}</h3>

  <ul class="demo-payment-list">
    @for (payment of payments; track payment.customer) {
      <li class="demo-payment-list__item">
        <span class="cba-text-body cba-text-secondary">{{ payment.customer }}</span>
        <div class="demo-payment-list__meta">
          <span class="cba-text-body demo-payment-list__amount">{{ payment.amount }}</span>
          <cba-badge [variant]="payment.variant" appearance="outline">
            {{ payment.status | titlecase }}
          </cba-badge>
        </div>
      </li>
    }
  </ul>
</div>
