<cba-field
  [label]="label()"
  [hint]="hint()"
  [error]="error()"
  [disabled]="isDisabled()"
  [readonly]="readonly()"
  [valid]="valid()"
  [controlId]="controlId">
  <input
    [id]="controlId"
    [type]="type()"
    [placeholder]="placeholder() ?? ''"
    [readOnly]="readonly()"
    [disabled]="isDisabled()"
    [value]="value() ?? ''"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="error() ? 'true' : null"
    (input)="onInput($event)"
    (blur)="onBlur()"
    class="cba-input__control" />
</cba-field>
